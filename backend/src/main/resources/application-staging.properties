# Staging Profile Configuration — Isolated from Production
spring.application.name=backend-staging

# Staging Database credentials (set in Render environment or fallback to staging DB)
spring.datasource.url=${STAGING_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/query_clue_staging}}
spring.datasource.username=${STAGING_DB_USER:${DB_USER:root}}
spring.datasource.password=${STAGING_DB_PASSWORD:${DB_PASSWORD:***REMOVED***}}

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Read-only datasource for player SQL queries in staging
spring.datasource.readonly.url=${STAGING_DB_READONLY_URL:${spring.datasource.url}}
spring.datasource.readonly.username=${STAGING_DB_READONLY_USER:${spring.datasource.username}}
spring.datasource.readonly.password=${STAGING_DB_READONLY_PASSWORD:${spring.datasource.password}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8081}

