spring.application.name=backend

# Primary datasource (read-write)
spring.datasource.url=jdbc:mysql://localhost:3306/query_clue
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:***REMOVED***}

# Read-only datasource for player SQL queries
spring.datasource.readonly.url=jdbc:mysql://localhost:3306/query_clue
spring.datasource.readonly.username=${DB_READONLY_USER:root}
spring.datasource.readonly.password=${DB_READONLY_PASSWORD:***REMOVED***}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081