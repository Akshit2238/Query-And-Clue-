spring.application.name=backend

# Primary datasource (read-write)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/query_clue}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:***REMOVED***}

# Read-only datasource for player SQL queries
spring.datasource.readonly.url=${DB_READONLY_URL:${spring.datasource.url}}
spring.datasource.readonly.username=${DB_READONLY_USER:${spring.datasource.username}}
spring.datasource.readonly.password=${DB_READONLY_PASSWORD:${spring.datasource.password}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8081}