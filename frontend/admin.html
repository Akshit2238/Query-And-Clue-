<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Portal — Query & Clue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #0a0a0f;
      color: #00ff88;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Login Overlay ── */
    #login-overlay {
      position: fixed; inset: 0;
      background: #0a0a0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 999;
    }
    #login-overlay h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem; color: #00ff88;
      text-shadow: 0 0 20px #00ff88;
    }
    #login-overlay p { color: #666; font-size: 0.85rem; }
    #key-input {
      background: #111; border: 1px solid #00ff88;
      color: #00ff88; padding: 12px 18px; font-family: inherit;
      font-size: 1rem; width: 320px; outline: none;
      border-radius: 4px; letter-spacing: 2px;
    }
    #key-input::placeholder { color: #333; letter-spacing: 1px; }
    #login-btn {
      background: #00ff88; color: #0a0a0f;
      border: none; padding: 12px 32px;
      font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
      cursor: pointer; border-radius: 4px; font-weight: 700;
      transition: box-shadow .2s;
    }
    #login-btn:hover { box-shadow: 0 0 20px #00ff88; }
    #login-error { color: #ff4466; font-size: 0.85rem; display: none; }

    /* ── Main Layout ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    header {
      background: #0d0d14;
      border-bottom: 1px solid #00ff8833;
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem; color: #00ff88;
      text-shadow: 0 0 10px #00ff8866;
    }
    header span { color: #444; font-size: 0.8rem; }

    .toolbar {
      padding: 16px 28px;
      display: flex; gap: 12px; align-items: center;
      border-bottom: 1px solid #00ff8818;
    }
    .btn {
      background: transparent; border: 1px solid #00ff88;
      color: #00ff88; padding: 8px 20px;
      font-family: inherit; font-size: 0.85rem;
      cursor: pointer; border-radius: 3px;
      transition: background .15s, box-shadow .15s;
    }
    .btn:hover { background: #00ff8818; box-shadow: 0 0 12px #00ff8844; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.danger { border-color: #ff4466; color: #ff4466; }
    .btn.danger:hover { background: #ff446618; }
    #gen-status { font-size: 0.82rem; color: #888; margin-left: 8px; }

    /* ── Cases Grid ── */
    .cases-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1; overflow: hidden;
    }

    /* Case List */
    #case-list {
      border-right: 1px solid #00ff8820;
      overflow-y: auto;
      padding: 12px 0;
    }
    .case-item {
      padding: 12px 20px;
      border-bottom: 1px solid #00ff8810;
      cursor: pointer;
      transition: background .12s;
    }
    .case-item:hover { background: #00ff8810; }
    .case-item.active { background: #00ff8818; border-left: 3px solid #00ff88; }
    .case-item .case-num { color: #00ff8866; font-size: 0.75rem; }
    .case-item .case-title { color: #ccc; font-size: 0.88rem; margin-top: 2px; }
    .case-item .case-meta { color: #555; font-size: 0.75rem; margin-top: 2px; }
    #no-cases { padding: 24px 20px; color: #333; font-size: 0.85rem; }

    /* Solution Panel */
    #solution-panel {
      overflow-y: auto;
      padding: 24px 28px;
    }
    #solution-panel h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem; color: #00ff88; margin-bottom: 18px;
    }
    .sol-block {
      background: #0d0d14;
      border: 1px solid #00ff8822;
      border-radius: 4px; padding: 16px 18px; margin-bottom: 16px;
    }
    .sol-block label {
      display: block; font-size: 0.72rem;
      color: #00ff8888; margin-bottom: 6px; letter-spacing: 1px;
      text-transform: uppercase;
    }
    .sol-block p { color: #bbb; font-size: 0.88rem; line-height: 1.6; }
    .sol-block .culprit { color: #ff4466; font-size: 1.1rem; font-weight: bold; }

    /* Hint Queries */
    .queries-section { margin-top: 8px; }
    .queries-section h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem; color: #00ff88;
      margin-bottom: 12px; opacity: .7;
    }
    .query-block {
      background: #080810;
      border: 1px solid #00ff8818;
      border-radius: 3px; padding: 12px 14px;
      margin-bottom: 10px; position: relative;
    }
    .query-block pre {
      color: #88ddaa; font-size: 0.8rem;
      white-space: pre-wrap; word-break: break-word;
    }
    .copy-btn {
      position: absolute; top: 8px; right: 8px;
      background: #00ff8820; border: none; color: #00ff88;
      font-family: inherit; font-size: 0.7rem; padding: 3px 8px;
      cursor: pointer; border-radius: 2px; opacity: 0;
      transition: opacity .15s;
    }
    .query-block:hover .copy-btn { opacity: 1; }

    #empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; color: #333; text-align: center;
    }
    #empty-state p { margin-top: 8px; font-size: 0.85rem; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #00ff8840; border-radius: 2px; }

    .tag {
      display: inline-block; padding: 2px 8px;
      border-radius: 2px; font-size: 0.72rem;
      background: #00ff8820; color: #00ff88;
      margin-left: 6px;
    }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-overlay">
  <h1>🔐 ADMIN PORTAL</h1>
  <p>Query &amp; Clue — Restricted Access</p>
  <input id="key-input" type="password" placeholder="Enter admin key..." autocomplete="off" />
  <button class="btn" id="login-btn">ACCESS</button>
  <span id="login-error">❌ Invalid key</span>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1>⚡ QUERY &amp; CLUE — ADMIN</h1>
    <span id="header-info">Cases: <strong id="case-count">0</strong></span>
  </header>

  <div class="toolbar">
    <button class="btn" id="gen-btn">⚡ Generate New Case</button>
    <button class="btn" id="refresh-btn">↻ Refresh</button>
    <span id="gen-status"></span>
  </div>

  <div class="cases-grid">
    <div id="case-list"><div id="no-cases">Loading cases...</div></div>
    <div id="solution-panel">
      <div id="empty-state">
        <div style="font-size:2rem">🕵️</div>
        <p>Select a case to view its solution &amp; hint queries</p>
      </div>
    </div>
  </div>
</div>

<script>
  const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
  const API = isLocal ? 'http://localhost:8081' : 'https://query-and-clue.onrender.com';
  let ADMIN_KEY = '';
  let cases = [];
  let activeCaseId = null;

  // ── Login ──
  const loginBtn = document.getElementById('login-btn');
  const keyInput = document.getElementById('key-input');
  const loginError = document.getElementById('login-error');

  async function tryLogin() {
    const key = keyInput.value.trim();
    if (!key) return;
    loginBtn.textContent = '...';
    loginBtn.disabled = true;

    try {
      const res = await fetch(`${API}/api/admin/cases`, {
        headers: { 'X-Admin-Key': key }
      });
      if (res.ok) {
        ADMIN_KEY = key;
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        cases = await res.json();
        renderCaseList();
      } else {
        loginError.style.display = 'block';
      }
    } catch {
      loginError.style.display = 'block';
    } finally {
      loginBtn.textContent = 'ACCESS';
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener('click', tryLogin);
  keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  // ── Case List ──
  function renderCaseList() {
    const list = document.getElementById('case-list');
    document.getElementById('case-count').textContent = cases.length;

    if (!cases.length) {
      list.innerHTML = '<div id="no-cases">No cases yet. Generate one!</div>';
      return;
    }

    list.innerHTML = cases.map(c => `
      <div class="case-item ${c.caseId === activeCaseId ? 'active' : ''}"
           onclick="selectCase(${c.caseId})">
        <div class="case-num">CASE #${c.caseId}</div>
        <div class="case-title">${c.title}</div>
        <div class="case-meta">${c.difficulty} · ${c.crimeType}</div>
      </div>
    `).join('');
  }

  // ── Select Case ──
  async function selectCase(id) {
    activeCaseId = id;
    renderCaseList();

    const panel = document.getElementById('solution-panel');
    panel.innerHTML = '<div style="padding:24px;color:#555">Loading solution...</div>';

    try {
      const res = await fetch(`${API}/api/admin/case/${id}/solution`, {
        headers: { 'X-Admin-Key': ADMIN_KEY }
      });
      const data = await res.json();

      panel.innerHTML = `
        <h2>CASE #${id} — SOLUTION</h2>

        <div class="sol-block">
          <label>🔴 Culprit</label>
          <p class="culprit">${data.culpritName}</p>
        </div>

        <div class="sol-block">
          <label>💡 Motive</label>
          <p>${data.motive}</p>
        </div>

        <div class="sol-block">
          <label>⚙️ Crime Method</label>
          <p>${data.crimeMethod}</p>
        </div>

        <div class="sol-block">
          <label>📖 Explanation</label>
          <p>${data.explanation}</p>
        </div>

        <div class="queries-section">
          <h3>🔍 HINT QUERIES</h3>
          ${data.hintQueries.map(q => `
            <div class="query-block">
              <pre>${escHtml(q)}</pre>
              <button class="copy-btn" onclick="copyQ(this)">COPY</button>
            </div>
          `).join('')}
        </div>
      `;
    } catch {
      panel.innerHTML = '<div style="padding:24px;color:#ff4466">Failed to load solution.</div>';
    }
  }

  // ── Generate ──
  const genBtn = document.getElementById('gen-btn');
  const genStatus = document.getElementById('gen-status');

  genBtn.addEventListener('click', async () => {
    genBtn.disabled = true;
    genStatus.innerHTML = '<span class="spinner">⚙</span> Generating...';

    try {
      const res = await fetch(`${API}/api/admin/generate`, {
        method: 'POST',
        headers: { 'X-Admin-Key': ADMIN_KEY }
      });
      const data = await res.json();

      if (res.ok) {
        genStatus.textContent = `✅ Generated: ${data.title}`;
        await refreshCases();
        selectCase(data.caseId);
      } else {
        genStatus.textContent = `❌ ${data.error || 'Generation failed'}`;
      }
    } catch {
      genStatus.textContent = '❌ Network error';
    } finally {
      genBtn.disabled = false;
      setTimeout(() => { genStatus.textContent = ''; }, 6000);
    }
  });

  // ── Refresh ──
  document.getElementById('refresh-btn').addEventListener('click', refreshCases);

  async function refreshCases() {
    const res = await fetch(`${API}/api/admin/cases`, {
      headers: { 'X-Admin-Key': ADMIN_KEY }
    });
    if (res.ok) { cases = await res.json(); renderCaseList(); }
  }

  // ── Helpers ──
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function copyQ(btn) {
    const text = btn.previousElementSibling.textContent;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'COPIED!';
      setTimeout(() => btn.textContent = 'COPY', 1500);
    });
  }
</script>
</body>
</html>
